<!doctype html>
<html lang="en">    
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Quantype</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="topbar">
        <div class="Logo">Quantype</div>
        <div class="tag">Human See, Human Solve</div>
        </header>


        <main class="hero">
            <h1>think <span class="accent">fast.</span></h1>
            <p class="subtitle">Pick your mode and start solving!</p>
            <div class="mode toggle">
                <button class="mode-btn active" data-mode="time">Time</button>
                <button class="mode-btn" data-mode="count">Count</button>
                </div>

                <div class="duration-row">
                    <button class="duration-btn" data-value="15">15</button>
                    <button class="duration-btn" data-value="30">30</button>
                    <button class="duration-btn" data-value="60">60</button>
                    <button class="duration-btn" data-value="120">120</button>
                
                </div>
                <hr class="divider">
                <div class="operations-row">
                    <span class="ops=label">Operations</span>
                    <Button class="op-button active" data-op="+">+</Button>
                    <Button class="op-button active" data-op="-">-</Button>
                    <Button class="op-button active" data-op="*">x</Button>
                    <Button class="op-button active" data-op="/">÷</Button>

            </div>
            <button class="start-btn">Start</button>
        </main>
        <script src="script.js"></script>
    
        
    </body>
</html>
